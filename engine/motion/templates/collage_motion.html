<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>hclipper HyperFrames & Collage Motion Canvas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:ital,wght@0,500;0,700;0,800;0,900;1,700&family=Playfair+Display:ital,wght@0,700;1,600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background: transparent;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    }
    #stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      pointer-events: none;
    }

    /* Common Motion Cue Wrapper */
    .motion-cue-wrap {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transform-origin: center center;
      will-change: transform, opacity;
      opacity: 0;
    }

    /* Standard Coordinates across 9:16 Canvas */
    .pos-upper-center { top: 160px; left: 54px; width: 972px; }
    .pos-center { top: 760px; left: 80px; width: 920px; }
    .pos-floating-right { top: 480px; right: 54px; width: 480px; transform-origin: right center; }
    .pos-floating-left { top: 480px; left: 54px; width: 480px; transform-origin: left center; }
    .pos-lower-third { bottom: 440px; left: 54px; width: 972px; }

    /* =========================================
       1. HYPERFRAMES: KINETIC HOOK BANNER
       ========================================= */
    .hyperframes-hook {
      width: 100%;
      background: rgba(9, 11, 19, 0.94);
      border: 1.5px solid rgba(245, 158, 11, 0.4);
      border-radius: 32px;
      padding: 38px 46px;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.85), 0 0 40px rgba(245, 158, 11, 0.18);
      backdrop-filter: blur(28px);
      text-align: center;
      position: relative;
    }
    .hook-badge-row {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 6px 18px;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
      font-size: 19px;
      font-weight: 800;
      color: #FBBF24;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      margin-bottom: 14px;
    }
    .hook-headline-text {
      font-size: 54px;
      font-weight: 900;
      line-height: 1.14;
      letter-spacing: -0.02em;
      color: #FFFFFF;
      text-transform: uppercase;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }
    .hook-svg-underline {
      margin-top: 10px;
      width: 480px;
      height: 24px;
    }

    /* =========================================
       2. COLLAGE: TORN PAPER STAT CARD
       ========================================= */
    .collage-torn-paper {
      position: relative;
      background: linear-gradient(135deg, #FAF8F5 0%, #EFEBE0 100%);
      color: #18181B;
      padding: 34px 38px 30px 38px;
      width: 100%;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.7), 0 4px 12px rgba(0, 0, 0, 0.3);
      /* Jagged organic torn edge clip-path */
      clip-path: polygon(
        0% 2%, 3% 0%, 7% 3%, 12% 0%, 18% 2%, 24% 0%, 31% 2%, 39% 0%, 48% 2%, 56% 0%, 65% 2%, 73% 0%, 82% 2%, 91% 0%, 97% 3%, 100% 1%,
        99% 25%, 100% 48%, 98% 72%, 100% 98%,
        96% 100%, 89% 98%, 81% 100%, 72% 98%, 62% 100%, 51% 98%, 42% 100%, 33% 98%, 22% 100%, 14% 98%, 6% 100%, 0% 97%,
        2% 75%, 0% 50%, 2% 25%
      );
      transform: rotate(2.5deg);
    }
    .scotch-tape-strip {
      position: absolute;
      top: -14px;
      left: 36%;
      width: 120px;
      height: 32px;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(3px);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      transform: rotate(-3deg);
      z-index: 10;
    }
    .torn-stat-label {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.18em;
      color: #B45309;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .torn-stat-value {
      font-size: 56px;
      font-weight: 900;
      color: #0F172A;
      letter-spacing: -0.03em;
      line-height: 1.05;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* =========================================
       3. COLLAGE: POLAROID CARD
       ========================================= */
    .collage-polaroid {
      position: relative;
      background: #FFFFFF;
      padding: 16px 16px 28px 16px;
      border-radius: 4px;
      box-shadow: 0 28px 55px rgba(0, 0, 0, 0.75), 0 2px 8px rgba(0, 0, 0, 0.2);
      width: 100%;
      transform: rotate(-3.5deg);
    }
    .polaroid-tape-corner {
      position: absolute;
      top: -12px;
      right: 18px;
      width: 85px;
      height: 28px;
      background: rgba(255, 255, 255, 0.52);
      border: 1px solid rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(2px);
      transform: rotate(18deg);
      z-index: 5;
    }
    .polaroid-photo-slot {
      width: 100%;
      height: 240px;
      background: linear-gradient(135deg, #1E293B, #0F172A);
      border-radius: 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #94A3B8;
      position: relative;
      overflow: hidden;
    }
    .polaroid-photo-slot::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.4) 100%);
    }
    .polaroid-photo-icon {
      font-size: 52px;
      margin-bottom: 8px;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
    }
    .polaroid-caption {
      font-family: 'Caveat', cursive, sans-serif;
      font-size: 34px;
      font-weight: 700;
      color: #1E293B;
      text-align: center;
      margin-top: 14px;
      line-height: 1.1;
    }

    /* =========================================
       4. HYPERFRAMES: HIGHLIGHTER SWATCH
       ========================================= */
    .hyperframes-highlighter-card {
      background: rgba(15, 23, 42, 0.92);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      padding: 30px 48px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(20px);
      text-align: center;
      width: 100%;
      position: relative;
    }
    .highlighter-eyebrow {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.22em;
      color: #94A3B8;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .highlighter-word-wrap {
      position: relative;
      display: inline-block;
      padding: 6px 14px;
    }
    .highlighter-ink-swatch {
      position: absolute;
      inset: 0;
      background: #FDE047;
      opacity: 0.92;
      border-radius: 6px;
      transform: skewX(-5deg);
      z-index: 1;
      /* Wiped left-to-right via clip-path */
      clip-path: inset(0 100% 0 0);
      mix-blend-mode: multiply;
    }
    .highlighter-word-text {
      position: relative;
      font-size: 60px;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: #0F172A;
      text-transform: uppercase;
      z-index: 2;
    }

    /* =========================================
       5. COLLAGE: RUBBER STAMP
       ========================================= */
    .collage-rubber-stamp {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 5px dashed #EF4444;
      border-radius: 16px;
      padding: 16px 36px;
      background: rgba(239, 68, 68, 0.08);
      color: #EF4444;
      transform: rotate(-9deg);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(239, 68, 68, 0.15);
      position: relative;
    }
    .stamp-text {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-family: 'Plus Jakarta Sans', sans-serif;
      text-shadow: 0 2px 8px rgba(239, 68, 68, 0.3);
    }
    .stamp-subtext {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin-top: 4px;
      opacity: 0.9;
    }

    /* =========================================
       6. HYPERFRAMES: WISDOM PLAQUE
       ========================================= */
    .hyperframes-wisdom-plaque {
      width: 100%;
      background: rgba(12, 16, 28, 0.95);
      border: 2px solid #D4AF37;
      border-radius: 28px;
      padding: 38px 46px;
      box-shadow: 0 30px 75px rgba(0, 0, 0, 0.85), 0 0 45px rgba(212, 175, 55, 0.2);
      backdrop-filter: blur(28px);
      text-align: center;
      position: relative;
    }
    .plaque-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Cinzel', serif;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.22em;
      color: #D4AF37;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .plaque-quote {
      font-family: 'Playfair Display', serif;
      font-size: 42px;
      font-weight: 700;
      font-style: italic;
      line-height: 1.25;
      color: #F8FAFC;
    }

    /* =========================================
       7. COLLAGE: CHAT BUBBLE (WhatsApp style)
       ========================================= */
    .collage-chat-bubble {
      background: #1F2C34;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 20px 24px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.7);
      width: 100%;
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .chat-bubble-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .chat-bubble-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #25D366;
      color: #0B141A;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 18px;
    }
    .chat-bubble-sender {
      font-size: 18px;
      font-weight: 700;
      color: #25D366;
    }
    .chat-bubble-body {
      font-size: 26px;
      font-weight: 600;
      line-height: 1.28;
      color: #E2E8F0;
    }
    .chat-bubble-ticks {
      align-self: flex-end;
      font-size: 13px;
      color: #53BDEB;
      font-weight: 800;
    }

    /* =========================================
       DEV SCRUBBER TOOLBAR (Removed during render)
       ========================================= */
    #dev-scrubber {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 9999;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      pointer-events: auto;
    }
    #dev-scrubber button {
      background: #F59E0B;
      color: #000;
      border: none;
      border-radius: 999px;
      padding: 6px 16px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
    }
    #dev-scrubber input[type=range] {
      width: 450px;
      accent-color: #F59E0B;
      cursor: pointer;
    }
    #dev-scrubber span {
      color: #F8FAFC;
      font-family: monospace;
      font-size: 14px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div id="stage"></div>

  <!-- Interactive Development Scrubber (headless renderer automatically removes this) -->
  <div id="dev-scrubber">
    <button id="playBtn">PLAY</button>
    <input type="range" id="timeSlider" min="0" max="30" step="0.05" value="0">
    <span id="timeLabel">0.00s</span>
  </div>

  <script>
    /**
     * Default Manifest Configuration
     * Injected by engine/motion/render.mjs during production rendering.
     */
    window.CONFIG = window.CONFIG || {
      duration: 30.0,
      cues: [
        {
          id: "cue_1",
          start: 0.0,
          duration: 3.8,
          style: "hyperframes",
          element: "kinetic_hook",
          text: "THE FATAL MONEY MISTAKE",
          position: "pos-upper-center",
          sfx: "fast_whip_whoosh"
        },
        {
          id: "cue_2",
          start: 5.2,
          duration: 4.2,
          style: "collage",
          element: "torn_paper_stat",
          text: "₦500,000 SPENT",
          position: "pos-floating-right",
          sfx: "paper_tear"
        },
        {
          id: "cue_3",
          start: 12.0,
          duration: 4.5,
          style: "hyperframes",
          element: "highlighter_swatch",
          text: "INVEST FIRST",
          position: "pos-center",
          sfx: "marker_squeak"
        },
        {
          id: "cue_4",
          start: 18.5,
          duration: 4.0,
          style: "collage",
          element: "rubber_stamp",
          text: "VERIFIED TRUTH",
          position: "pos-floating-left",
          sfx: "stamp_thump"
        },
        {
          id: "cue_5",
          start: 24.5,
          duration: 4.5,
          style: "hyperframes",
          element: "wisdom_plaque",
          text: "Discipline compounds into freedom.",
          position: "pos-upper-center",
          sfx: "warm_chime"
        }
      ]
    };

    window.TOTAL_DURATION = window.CONFIG.duration || 30.0;

    /**
     * Closed-Form Physical Spring Evaluator
     * Analytical closed-form solution with zero numerical integration drift.
     */
    class Spring {
      constructor({ mass = 1.0, stiffness = 100.0, damping = 10.0 }) {
        this.m = mass;
        this.k = stiffness;
        this.c = damping;
        this.w0 = Math.sqrt(this.k / this.m);
        this.zeta = this.c / (2.0 * Math.sqrt(this.m * this.k));
        this.wd = this.w0 * Math.sqrt(Math.max(0, 1.0 - this.zeta * this.zeta));
      }

      evaluate(t) {
        if (t <= 0) return 0;
        const decay = Math.exp(-this.zeta * this.w0 * t);
        if (this.zeta < 1.0) {
          // Underdamped (overshoot / bounce)
          const angle = this.wd * t;
          return 1.0 - decay * (Math.cos(angle) + ((this.zeta * this.w0) / this.wd) * Math.sin(angle));
        } else {
          // Critically damped / Overdamped
          return 1.0 - decay * (1.0 + this.w0 * t);
        }
      }
    }

    const Springs = {
      snappy: new Spring({ mass: 0.75, stiffness: 280, damping: 22 }),
      bouncy: new Spring({ mass: 0.9, stiffness: 170, damping: 11 }),
      heavy: new Spring({ mass: 2.0, stiffness: 140, damping: 26 })
    };

    /**
     * DOM Template Generator for Each Cue
     */
    function renderCueHtml(c, idx) {
      const posClass = c.position && c.position.startsWith("pos-") 
        ? c.position 
        : (c.position ? `pos-${c.position}` : "pos-upper-center");

      const element = c.element || c.type || "kinetic_hook";
      const text = (c.text || c.headline || "KEY MOMENT").toUpperCase();

      if (element === "kinetic_hook") {
        return `
        <div class="motion-cue-wrap ${posClass}" id="el_${c.id}">
          <div class="hyperframes-hook">
            <div class="hook-badge-row">
              <span>⚡ HIGH-RETENTION HOOK</span>
            </div>
            <div class="hook-headline-text">${text}</div>
            <svg class="hook-svg-underline" viewBox="0 0 480 24" fill="none">
              <path id="path_underline_${c.id}" d="M 10 16 Q 160 22 240 14 T 470 12" stroke="#F59E0B" stroke-width="7" stroke-linecap="round" />
            </svg>
          </div>
        </div>
        `;
      } else if (element === "torn_paper_stat") {
        return `
        <div class="motion-cue-wrap ${posClass}" id="el_${c.id}">
          <div class="collage-torn-paper">
            <div class="scotch-tape-strip"></div>
            <div class="torn-stat-label">TACTILE EVIDENCE</div>
            <div class="torn-stat-value">${text}</div>
          </div>
        </div>
        `;
      } else if (element === "polaroid_card") {
        return `
        <div class="motion-cue-wrap ${posClass}" id="el_${c.id}">
          <div class="collage-polaroid">
            <div class="polaroid-tape-corner"></div>
            <div class="polaroid-photo-slot">
              <div class="polaroid-photo-icon">📷</div>
              <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;">MOMENT EVIDENCE</span>
            </div>
            <div class="polaroid-caption">${c.text || "Key Life Lesson"}</div>
          </div>
        </div>
        `;
      } else if (element === "highlighter_swatch") {
        return `
        <div class="motion-cue-wrap ${posClass}" id="el_${c.id}">
          <div class="hyperframes-highlighter-card">
            <div class="highlighter-eyebrow">KEY REINFORCEMENT</div>
            <div class="highlighter-word-wrap">
              <div class="highlighter-ink-swatch" id="ink_${c.id}"></div>
              <span class="highlighter-word-text">${text}</span>
            </div>
          </div>
        </div>
        `;
      } else if (element === "rubber_stamp") {
        return `
        <div class="motion-cue-wrap ${posClass}" id="el_${c.id}">
          <div class="collage-rubber-stamp">
            <div class="stamp-text">${text}</div>
            <div class="stamp-subtext">OFFICIALLY VERIFIED</div>
          </div>
        </div>
        `;
      } else if (element === "wisdom_plaque") {
        return `
        <div class="motion-cue-wrap ${posClass}" id="el_${c.id}">
          <div class="hyperframes-wisdom-plaque">
            <div class="plaque-badge">✦ TIMELESS PRINCIPLE ✦</div>
            <div class="plaque-quote">"${c.text || text}"</div>
          </div>
        </div>
        `;
      } else if (element === "chat_bubble") {
        return `
        <div class="motion-cue-wrap ${posClass}" id="el_${c.id}">
          <div class="collage-chat-bubble">
            <div class="chat-bubble-header">
              <div class="chat-bubble-avatar">💬</div>
              <div class="chat-bubble-sender">Direct Message</div>
            </div>
            <div class="chat-bubble-body">${c.text || text}</div>
            <div class="chat-bubble-ticks">✓✓ Read</div>
          </div>
        </div>
        `;
      }

      return "";
    }

    /**
     * Stage Initialization
     */
    window.initStage = function() {
      const stage = document.getElementById("stage");
      if (!window.CONFIG.cues || !stage) return;
      stage.innerHTML = window.CONFIG.cues.map(renderCueHtml).join("\n");

      // Set up stroke-dasharray for SVGs
      window.CONFIG.cues.forEach(c => {
        const pathEl = document.getElementById(`path_underline_${c.id}`);
        if (pathEl) {
          const len = pathEl.getTotalLength ? pathEl.getTotalLength() : 480;
          pathEl.style.strokeDasharray = len;
          pathEl.style.strokeDashoffset = len;
          pathEl._totalLength = len;
        }
      });
    };

    window.initStage();

    /**
     * Master Deterministic Seeker
     * Evaluates exact element transformation at any seek timestamp t
     */
    window.seek = function(t) {
      if (!window.CONFIG.cues) return;

      window.CONFIG.cues.forEach(c => {
        const el = document.getElementById("el_" + c.id);
        if (!el) return;

        const startT = typeof c.start === "number" ? c.start : (typeof c.time_offset === "number" ? c.time_offset : 0.0);
        const dur = typeof c.duration === "number" ? c.duration : 4.0;
        const endT = startT + dur;

        if (t < startT || t > endT) {
          el.style.opacity = "0";
          el.style.transform = "scale(0.8) translateY(30px)";
          return;
        }

        const enterDt = t - startT;
        const exitLead = endT - t;

        // Choose spring profile based on element type
        const isHeavy = c.element === "rubber_stamp" || c.element === "torn_paper_stat";
        const spring = isHeavy ? Springs.heavy : Springs.bouncy;

        let scale = 1.0;
        let translateY = 0;
        let opacity = 1.0;

        if (enterDt < 0.65) {
          const p = spring.evaluate(enterDt);
          opacity = Math.min(1.0, enterDt / 0.18);
          scale = isHeavy ? (1.25 - 0.25 * p) : (0.75 + 0.25 * p);
          translateY = (1.0 - p) * 35;
        } else if (exitLead < 0.40) {
          const exitP = exitLead / 0.40;
          opacity = Math.max(0.0, exitP);
          scale = 0.95 + 0.05 * exitP;
          translateY = (1.0 - exitP) * -20;
        }

        el.style.opacity = opacity;
        el.style.transform = `translateY(${translateY}px) scale(${scale})`;

        // Animated underline progress
        const pathEl = document.getElementById(`path_underline_${c.id}`);
        if (pathEl && pathEl._totalLength) {
          const drawProgress = Math.max(0, Math.min(1, (enterDt - 0.25) / 0.65));
          const p = Springs.snappy.evaluate(drawProgress * 0.75);
          pathEl.style.strokeDashoffset = pathEl._totalLength * (1.0 - Math.min(1.0, p));
        }

        // Animated highlighter ink wipe
        const inkEl = document.getElementById(`ink_${c.id}`);
        if (inkEl) {
          const wipeProgress = Math.max(0, Math.min(1, (enterDt - 0.20) / 0.55));
          const p = Springs.snappy.evaluate(wipeProgress * 0.7);
          const rightInset = Math.max(0, 100 * (1.0 - Math.min(1.0, p)));
          inkEl.style.clipPath = `inset(0 ${rightInset}% 0 0)`;
        }
      });
    };

    window.seek(0);

    // Interactive Preview Controls
    const slider = document.getElementById("timeSlider");
    const label = document.getElementById("timeLabel");
    slider.max = window.TOTAL_DURATION;

    slider.addEventListener("input", (e) => {
      const t = parseFloat(e.target.value);
      label.textContent = t.toFixed(2) + "s";
      window.seek(t);
    });

    let isPlaying = false;
    const playBtn = document.getElementById("playBtn");
    playBtn.addEventListener("click", () => {
      if (isPlaying) {
        isPlaying = false;
        playBtn.textContent = "PLAY";
      } else {
        isPlaying = true;
        playBtn.textContent = "PAUSE";
        const startT = parseFloat(slider.value);
        const startStamp = performance.now();

        function step(now) {
          if (!isPlaying) return;
          const elapsed = (now - startStamp) / 1000 + startT;
          if (elapsed > window.TOTAL_DURATION) {
            slider.value = 0;
            window.seek(0);
            isPlaying = false;
            playBtn.textContent = "PLAY";
            return;
          }
          slider.value = elapsed;
          label.textContent = elapsed.toFixed(2) + "s";
          window.seek(elapsed);
          requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      }
    });
  </script>
</body>
</html>
