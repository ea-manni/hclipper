<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>hclipper Kinetic Lower Third</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background: transparent;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      pointer-events: none;
    }

    /* Morphing Lower Third */
    .lower-third-card {
      position: absolute;
      bottom: 420px; /* Above TikTok / Reels safezone */
      left: 64px;
      height: 110px;
      background: rgba(12, 16, 26, 0.90);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 999px;
      padding: 12px 28px 12px 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(250, 204, 21, 0.15);
      display: flex;
      align-items: center;
      gap: 20px;
      overflow: hidden;
      transform-origin: left center;
    }

    .avatar-pill {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      background: linear-gradient(135deg, #FACC15, #CA8A04);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 900;
      color: #0F172A;
      box-shadow: 0 0 20px rgba(250, 204, 21, 0.4);
      flex-shrink: 0;
    }

    .info-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
      white-space: nowrap;
    }

    .speaker-name {
      font-size: 32px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: -0.01em;
    }

    .topic-desc {
      font-size: 20px;
      font-weight: 600;
      color: #FACC15;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="card" class="lower-third-card">
      <div id="avatar" class="avatar-pill">PB</div>
      <div id="info" class="info-wrap">
        <div id="speaker" class="speaker-name">Pastor Bankie</div>
        <div id="topic" class="topic-desc">The Believer's Foundation</div>
      </div>
    </div>
  </div>

  <script src="../motion.js"></script>
  <script>
    const { Spring, Springs, track, lerp, clamp } = window.MotionEngine;

    window.CONFIG = {
      speaker: "Pastor Bankie",
      topic: "The Believer's Foundation",
      initials: "PB",
      duration: 4.5,
      fadeStart: 3.8,
      fadeEnd: 4.2
    };

    window.TOTAL_DURATION = window.CONFIG.duration;

    const card = document.getElementById("card");
    const avatar = document.getElementById("avatar");
    const info = document.getElementById("info");

    window.seek = function(t) {
      const cfg = window.CONFIG;

      // 1. Container Pill Expansion via Springs.bouncy
      const popSpring = Springs.bouncy;
      const popProg = popSpring.evaluate(t);
      const scaleX = lerp(0.2, 1.0, popProg);
      const scaleY = lerp(0.2, 1.0, popProg);

      // Fade-out at end
      let opacity = clamp(t / 0.12, 0, 1);
      if (t >= cfg.fadeStart) {
        opacity = clamp(1.0 - (t - cfg.fadeStart) / (cfg.fadeEnd - cfg.fadeStart), 0, 1);
      }

      card.style.opacity = opacity;
      card.style.transform = `scale(${scaleX}, ${scaleY})`;

      // 2. Avatar pop
      const avatarProg = Springs.elastic.evaluate(Math.max(0, t - 0.05));
      avatar.style.transform = `scale(${avatarProg})`;

      // 3. Info text slide-in
      const textProg = Springs.snappy.evaluate(Math.max(0, t - 0.15));
      const textX = lerp(40, 0, textProg);
      const textAlpha = clamp((t - 0.15) / 0.1, 0, 1);
      info.style.transform = `translateX(${textX}px)`;
      info.style.opacity = textAlpha;
    };

    window.seek(0);
  </script>
</body>
</html>
