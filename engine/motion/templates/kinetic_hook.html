<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>hclipper Kinetic Hook Banner</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background: transparent;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }
    #stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      pointer-events: none;
    }

    /* Hook Container */
    .hook-card {
      position: absolute;
      top: 150px;
      left: 54px;
      width: 972px;
      background: rgba(10, 13, 20, 0.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 28px;
      padding: 32px 40px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(0, 245, 255, 0.12);
      transform-origin: center top;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .badge-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .pill-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 999px;
      background: rgba(0, 245, 255, 0.12);
      border: 1px solid rgba(0, 245, 255, 0.35);
      color: #00F5FF;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .pill-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #00F5FF;
      box-shadow: 0 0 10px #00F5FF;
    }

    .timestamp-badge {
      color: rgba(255, 255, 255, 0.5);
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .headline-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 14px;
      line-height: 1.15;
    }

    .word {
      display: inline-block;
      font-size: 56px;
      font-weight: 900;
      color: #FFFFFF;
      letter-spacing: -0.02em;
      transform-origin: center bottom;
      will-change: transform, opacity;
    }

    .word.highlight {
      color: #00F5FF;
      text-shadow: 0 0 24px rgba(0, 245, 255, 0.6);
    }

    .word.gold-highlight {
      color: #FACC15;
      text-shadow: 0 0 24px rgba(250, 204, 21, 0.6);
    }

    /* Dev Preview Scrubber (Hidden during render) */
    #dev-scrubber {
      position: fixed;
      bottom: 24px;
      left: 54px;
      width: 972px;
      background: rgba(15, 23, 42, 0.95);
      padding: 16px 24px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      display: flex;
      align-items: center;
      gap: 20px;
      font-family: monospace;
      font-size: 18px;
      z-index: 9999;
    }
    #dev-scrubber input[type="range"] {
      flex: 1;
      height: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="hookCard" class="hook-card">
      <div class="badge-row">
        <div class="pill-badge">
          <span class="pill-dot"></span>
          <span id="badgeText">KEY INSIGHT</span>
        </div>
        <div id="clipTimestamp" class="timestamp-badge">PASTOR BANKIE</div>
      </div>
      <div id="headline" class="headline-wrap">
        <!-- Words injected dynamically -->
      </div>
    </div>
  </div>

  <div id="dev-scrubber">
    <span id="timeLabel">0.00s</span>
    <input type="range" id="timeSlider" min="0" max="5.0" step="0.01" value="0">
    <button id="playBtn" style="padding: 6px 16px; background: #00F5FF; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">PLAY</button>
  </div>

  <script src="../motion.js"></script>
  <script>
    const { Spring, Springs, track, lerp, clamp } = window.MotionEngine;

    // Configuration
    window.CONFIG = {
      headline: "WHY PURPOSE PRECEDES PROVISION IN THE KINGDOM",
      badge: "KEY INSIGHT",
      speaker: "PASTOR BANKIE",
      highlightWords: ["PURPOSE", "PROVISION", "KINGDOM"],
      duration: 3.5,        // Total clip duration in seconds
      fadeStart: 2.8,       // When hook card begins fading out
      fadeEnd: 3.2,
      theme: "neon"         // "neon", "gold", "clean"
    };

    window.TOTAL_DURATION = window.CONFIG.duration;

    const hookCard = document.getElementById("hookCard");
    const headlineEl = document.getElementById("headline");
    const badgeText = document.getElementById("badgeText");
    const clipTimestamp = document.getElementById("clipTimestamp");

    // Initialize headline words
    badgeText.textContent = window.CONFIG.badge;
    clipTimestamp.textContent = window.CONFIG.speaker;

    const words = window.CONFIG.headline.split(" ");
    headlineEl.innerHTML = words.map((w, idx) => {
      const isHigh = window.CONFIG.highlightWords.includes(w.replace(/[^A-Z]/g, ""));
      const highClass = isHigh ? (window.CONFIG.theme === "gold" ? "gold-highlight" : "highlight") : "";
      return `<span class="word ${highClass}" data-index="${idx}">${w}</span>`;
    }).join(" ");

    const wordEls = document.querySelectorAll(".word");

    /**
     * Pure Mathematical Deterministic Seek Function
     */
    window.seek = function(t) {
      const cfg = window.CONFIG;

      // 1. Container Card Spring Entrance (Starts at t = 0.0s)
      const enterSpring = Springs.snappy;
      const enterProgress = enterSpring.evaluate(t);
      const cardScale = lerp(0.82, 1.0, enterProgress);
      const cardTranslateY = lerp(-60, 0, enterProgress);
      
      // Card Fade-in at start, Fade-out at fadeStart
      let cardOpacity = clamp(t / 0.15, 0, 1);
      if (t >= cfg.fadeStart) {
        cardOpacity = clamp(1.0 - (t - cfg.fadeStart) / (cfg.fadeEnd - cfg.fadeStart), 0, 1);
      }

      hookCard.style.opacity = cardOpacity;
      hookCard.style.transform = `translateY(${cardTranslateY}px) scale(${cardScale})`;

      // 2. Staggered Word Kinetic Elastic Pops
      const baseDelay = 0.12;
      const staggerDelay = 0.045;

      wordEls.forEach((el, i) => {
        const wordStart = baseDelay + i * staggerDelay;
        const dt = t - wordStart;

        if (dt <= 0) {
          el.style.opacity = "0";
          el.style.transform = "translateY(36px) scale(0.7)";
        } else {
          const wordSpring = Springs.elastic;
          const wordProgress = wordSpring.evaluate(dt);
          const opacity = clamp(dt / 0.08, 0, 1);
          const y = lerp(36, 0, wordProgress);
          const scale = lerp(0.7, 1.0, wordProgress);

          el.style.opacity = opacity;
          el.style.transform = `translateY(${y}px) scale(${scale})`;
        }
      });
    };

    // Initialize at t = 0
    window.seek(0);

    // Interactive Preview Controls
    const slider = document.getElementById("timeSlider");
    const label = document.getElementById("timeLabel");
    slider.max = window.TOTAL_DURATION;

    slider.addEventListener("input", (e) => {
      const t = parseFloat(e.target.value);
      label.textContent = t.toFixed(2) + "s";
      window.seek(t);
    });

    let isPlaying = false;
    let animId = null;
    let startTime = null;

    document.getElementById("playBtn").addEventListener("click", () => {
      if (isPlaying) {
        isPlaying = false;
        document.getElementById("playBtn").textContent = "PLAY";
      } else {
        isPlaying = true;
        document.getElementById("playBtn").textContent = "PAUSE";
        const startT = parseFloat(slider.value);
        const startStamp = performance.now();

        function step(now) {
          if (!isPlaying) return;
          const elapsed = (now - startStamp) / 1000 + startT;
          if (elapsed > window.TOTAL_DURATION) {
            slider.value = 0;
            window.seek(0);
            isPlaying = false;
            document.getElementById("playBtn").textContent = "PLAY";
            return;
          }
          slider.value = elapsed;
          label.textContent = elapsed.toFixed(2) + "s";
          window.seek(elapsed);
          requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      }
    });
  </script>
</body>
</html>
